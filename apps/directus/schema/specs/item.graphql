  """
  bexio_contact_id: Int
  clockodo_customer_id: String
  date_created: Date
  date_created_func: datetime_functions
  date_updated: Date
  date_updated_func: datetime_functions
  id: ID!

  """The project shortcode in Jira. Eg. HAS or BA"""
  jira_short_code: String
  name: String!

  """
  Wenn aktiv, werden sämtliche Slack-Warnungen für diesen Kunden unterdrückt, bis der Schalter wieder deaktiviert wird.
  """
  notifications_paused: Boolean!

  """
  Index of the last active onboarding step (0-based). Used to track progress for manual/email steps that have no service ID.
  """
  onboarding_current_step: Int

  """
  IDs of completed manual-onboarding checklist items. Persisted so the checklist state survives a page reload.
  """
  onboarding_manual_checklist: JSON
  onboarding_manual_checklist_func: count_functions

