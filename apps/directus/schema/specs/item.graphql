input update_Clients_input {
  apiUrl: String

  """
  Finde die Bexio-Kontakt-Nummer unter https://office.bexio.com/index.php/kontakt/list?sortBy=name:asc&filter=all  bearbeite den gewünschten Kontakt und kopiere die Nummer.
  """
  bexio_contact_id: Int
  clockodo_customer_id: String
  date_created: Date
  date_updated: Date
  id: ID

  """The project shortcode in Jira. Eg. HAS or BA"""
  jira_short_code: String
  name: String

  """
  Wenn aktiv, werden sämtliche Slack-Warnungen für diesen Kunden unterdrückt, bis der Schalter wieder deaktiviert wird.
  """
  notifications_paused: Boolean

  """
  Index of the last active onboarding step (0-based). Used to track progress for manual/email steps that have no service ID.
  """
  onboarding_current_step: Int

  """
  IDs of completed manual-onboarding checklist items. Persisted so the checklist state survives a page reload.
  """
  onboarding_manual_checklist: JSON

  """Slack channel ID created during client onboarding"""
  slack_channel_id: String
  sort: Int
  status: String
  user_created: update_directus_users_input
  user_updated: update_directus_users_input

  """
  Wenn aktiv, wird der wöchentliche Slack-Bericht für diesen Kunden unterdrückt. Unabhängig vom allgemeinen Notification-Pause-Schalter.
  """
  weekly_report_paused: Boolean

  """
  Abrechnungsmodell des Kunden. Prepaid = günstigerer Stundensatz, im Voraus bezahlte Top-Ups. Monatsrechnung = höherer Stundensatz, monatliche Abrechnung nach Aufwand.
  """
  billing_mode: String
  allowedUsers: [update_Clients_directus_users_input]
  periods: [update_Clients_Periods_input]
  articles: [update_PeerArticles_input]
  jiraWarnings: [update_JiraWarnings_input]
}

