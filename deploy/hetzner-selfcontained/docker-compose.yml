# =============================================================================
# FaaS self-contained – Hetzner-VPS (root@167.233.56.27)
# Docker 29.6 + Compose v5 bereits installiert.
#
# Drei Dienste laufen self-contained auf der VPS:
#   postgres  – PostgreSQL 15 (benanntes Volume fuer PGDATA)
#   directus  – Directus 11.17.2 (uploads + extensions als Bind-Mounts)
#   front     – Next.js-App (Build aus ../../apps/front)
#
# INTERIM-TOPOLOGIE (bis der Python-Port auf TS fertig ist):
#   App + Directus + Postgres = self-contained auf Hetzner.
#   Die schwere Anreicherungs-/Matching-Pipeline laeuft UEBERGANGSWEISE weiter
#   auf dem Spark und schreibt ueber Tailscale in DIESE Hetzner-DB, bis der
#   Port abgeschlossen ist. Deshalb braucht die VPS Tailscale (siehe RUNBOOK,
#   `tailscale up` ist ein manueller, interaktiv zu autorisierender Schritt).
#
# ENTFALLEN (bewusst nicht in diesem Compose):
#   Embeddings / Qdrant. Per Code-Analyse belegt: die Front-App berechnet keine
#   Embeddings und ruft kein Qdrant auf; sie zeigt nur einen vorberechneten
#   `embedding_score` aus den match_results an (den die Spark-Pipeline schreibt).
#   Die Kandidatenauswahl im Matching braucht Qdrant nicht.
#
# EXTERN (bleiben Anbindungen, keine Container hier – nur Env/Platzhalter):
#   Gmail/SMTP-Versand (Directus EMAIL_SMTP_*), Slack-Webhook (Pipeline),
#   Drive als optionaler read-only rclone-Mount (unten auskommentiert).
# =============================================================================

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    # Kein Host-Port-Mapping noetig: Directus erreicht die DB Compose-intern
    # ueber den Service-Namen `postgres`. Die Spark-Pipeline schreibt NICHT
    # direkt in Postgres, sondern ueber die Directus-Tailscale-Schnittstelle
    # bzw. per DB-Zugang, der bei Bedarf separat/kontrolliert geoeffnet wird
    # (siehe RUNBOOK, Interim-Abschnitt). Standardmaessig bleibt Postgres
    # nicht nach aussen exponiert.
    environment:
      POSTGRES_DB: directus_db
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt – .env aus .env.example ableiten}
      # Quelle laeuft mit UTF8 / en_US.utf8. Fuer eine identische Kollation ggf.
      # ein Locale-faehiges Image/initdb verwenden (siehe RUNBOOK-Checkliste).
      # Bei logischem pg_restore ist ein Kollations-Mismatch fuer Directus
      # unkritisch (betrifft nur Textsortier-Reihenfolge), daher hier Default.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  directus:
    image: directus/directus:11.17.2   # exakt gepinnt (Spark-Laufzeit), NICHT :11
    restart: unless-stopped
    ports:
      # NICHT 0.0.0.0 (die VPS hat eine oeffentliche IP!). Nur lokal: der
      # Cloudflare-Tunnel erreicht Directus lokal. Fuer den Interim-Schreibpfad
      # des Spark-Daemons ueber Tailscale zusaetzlich die Tailscale-IP der VPS
      # binden (nach `tailscale up` eintragen), z.B.:  - "100.x.y.z:8055:8055"
      - "127.0.0.1:8055:8055"
      # B9: Interim-Schreibpfad. Der Spark-Forwarder (127.0.0.1:8055 des Spark)
      # leitet ueber Tailscale hierher. NUR die Tailscale-IP, NIE 0.0.0.0
      # (die VPS hat eine oeffentliche IP). ufw laesst tailscale0 zu, sonst deny.
      - "100.120.78.79:8055:8055"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Bind-Mounts: muessen 1:1 vom Spark mitgenommen werden.
      #   uploads    = hochgeladene Assets/Dateien
      #   extensions = installierte Erweiterungen inkl. directus-extension-sync
      - ./data/uploads:/directus/uploads
      - ./data/extensions:/directus/extensions
    environment:
      # --- Datenbank (Compose-intern ueber Service-Name `postgres`) ---
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: directus_db
      DB_USER: directus
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
      # --- Sicherheit: KEY/SECRET MUESSEN 1:1 aus dem Altsystem stammen ---
      # Sonst werden bestehende verschluesselte Felder und Sessions ungueltig.
      KEY: ${KEY:?KEY fehlt – 1:1 aus dem Spark-Setup uebernehmen}
      SECRET: ${SECRET:?SECRET fehlt – 1:1 aus dem Spark-Setup uebernehmen}
      # --- Admin (Bootstrap) ---
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wepublish.ch}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD fehlt}
      NODE_ENV: production
      # Neu fuer die VPS zu bestimmen (Altsystem hatte KEINE PUBLIC_URL,
      # oeffentlicher Zugang lief ueber Cloudflare-Tunnel).
      PUBLIC_URL: ${PUBLIC_URL:-/}
      # Contract-PDFs kommen base64 im JSON-Body (~33% groesser) -> Headroom.
      MAX_PAYLOAD_SIZE: ${MAX_PAYLOAD_SIZE:-15mb}
      # Scheduled Flows (Wochenreport etc.) an Schweizer Wanduhrzeit.
      TZ: Europe/Zurich
      # --- E-Mail-Versand (Gmail/SMTP – externe Anbindung, Platzhalter) ---
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@t.wepublish.email}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}
      # Unterdrueckt nur die SMTP-Pruefung beim Start (Host ist bewusst leer).
      # Der email:connection-Check im /server/health-Endpoint laeuft trotzdem;
      # der Spark-Heartbeat ignoriert ihn deshalb gezielt (faas_heartbeat.py).
      # Beim Einrichten von SMTP wieder auf true stellen.
      EMAIL_VERIFY_SETUP: ${EMAIL_VERIFY_SETUP:-false}
      # --- Invite-/Reset-Links: Frontend-URLs der VPS auf die Allow-List ---
      PASSWORD_RESET_URL_ALLOW_LIST: ${PASSWORD_RESET_URL_ALLOW_LIST:-}
      USER_INVITE_URL_ALLOW_LIST: ${USER_INVITE_URL_ALLOW_LIST:-}
      USER_INVITE_TOKEN_TTL: ${USER_INVITE_TOKEN_TTL:-14d}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  front:
    # Das Image wird auf dem Mac gebaut (linux/amd64) und per `docker load`
    # hierher uebertragen -> `scripts/deploy-front.sh`. FRONT_TAG erlaubt den
    # Rollback auf einen frueheren Commit-SHA:
    #   FRONT_TAG=<sha> docker compose up -d --no-build front
    image: faas-front:${FRONT_TAG:-latest}
    # ACHTUNG: NIE `docker compose up --build front` auf der VPS ausfuehren.
    # `next build` sprengt hier den Speicher (Vorfall 24.07.2026: Portal 530,
    # SSH tot) - auch mit 4 GB Swap. Der build-Block bleibt nur fuer den
    # Notfall-Bootstrap auf einer Maschine mit genug RAM stehen.
    build:
      # Von deploy/hetzner-selfcontained/ aus: ../../apps/front = App-Verzeichnis.
      context: ../../apps/front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # NICHT 0.0.0.0: nur lokal, der Cloudflare-Tunnel erreicht die App lokal.
      - "127.0.0.1:3000:3000"
      # B7-Cutover: der token-managed Tunnel-Ingress zeigt (wie am Spark) auf
      # http://localhost:3009 -> dieselbe Portnummer hier spiegeln, damit der
      # VPS-cloudflared-Connector (network_mode: host) den Front erreicht.
      - "127.0.0.1:3009:3000"
    depends_on:
      directus:
        condition: service_healthy
    # KEIN `env_file: .env` — sonst landen die Directus-Master-Secrets
    # (KEY/SECRET/DB_PASSWORD/ADMIN_PASSWORD) unnoetig in der oeffentlich
    # exponierten Next.js-App (Least-Privilege). Stattdessen NUR die tatsaechlich
    # benoetigten Front-Variablen, aus der (compose-intern automatisch geladenen)
    # .env interpoliert. Fehlende Werte -> App degradiert (kein Boot-Fehler);
    # echte Werte erzwingt der Runbook-Preflight (Platzhalter-Scan).
    environment:
      # HART intern – ueberschreibt bewusst jeden .env-Wert:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-}
      PORTAL_TREFFER_LIMIT: ${PORTAL_TREFFER_LIMIT:-20}
      # Gueltigkeit eines Anmeldelinks in Stunden (Sicherheitsvorgabe 28.07.2026,
      # Michael Scheurer: kurzlebig, nicht dauerhaft). 8 Stunden, weil der Link
      # solange SMTP fehlt von Hand weitergeleitet wird. Sobald der Versand
      # automatisch laeuft, hier auf 2 stellen. Grenzen in der App: 1 bis 24.
      PORTAL_LOGIN_TTL_STUNDEN: ${PORTAL_LOGIN_TTL_STUNDEN:-8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      # Crawler (interim): Spark-Crawler ueber Tailscale, aus .env uebersteuerbar.
      FIRECRAWL_URL: ${FIRECRAWL_URL:-http://100.80.47.49:8891}
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      FAAS_AGENT_ENABLED: ${FAAS_AGENT_ENABLED:-false}
      DATENSUPPE_BASE: ${DATENSUPPE_BASE:-}
    # Healthcheck, damit cloudflared erst startet, wenn die App wirklich
    # antwortet. Ohne ihn zeigte der Tunnel beim Stack-Start auf einen toten
    # Port (cloudflared-Log 27.07.: «connection refused» auf :3009, Nutzer
    # sahen Fehlerseiten). /portal/login ist ungeschuetzt und leichtgewichtig.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/portal/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # cloudflared – Cloudflare-Tunnel-Connector (B7-Cutover).
  # network_mode: host, damit das token-managed Ingress-Ziel http://localhost:3009
  # (aus dem Dashboard, identisch zum Spark) den lokal auf 127.0.0.1:3009
  # publizierten Front erreicht. Gleicher TUNNEL_TOKEN wie der Spark = zweiter
  # Connector desselben Tunnels; nach Verifikation wird der Spark-Connector gestoppt.
  cloudflared:
    # Gepinnt statt :latest (28.07.2026): bei latest genuegt ein fehlerhafter
    # Upstream-Release plus ein `docker compose pull`, um das Portal offline
    # zu nehmen. Version = der am 28.07. laufende Stand. Bewusst anheben.
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN fehlt – 1:1 vom Spark uebernehmen}
    depends_on:
      # Erst verbinden, wenn die App antwortet (siehe front-Healthcheck).
      front:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OPTIONAL: Drive read-only Mount (Datensuppe) fuer DATENSUPPE_BASE.
  # Nur noetig, wenn Ein-Knopf-DNA aus der geteilten Drive-Ablage lesen soll.
  # rclone.conf mit `gdrive-faas:`-Remote (Credentials aus bestehendem
  # Spark-Setup, NICHT neu erzeugen) daneben ablegen, NIE committen.
  # Bei Aktivierung zusaetzlich bei `front` das Volume `datensuppe:/datensuppe:ro`
  # eintragen und in .env `DATENSUPPE_BASE=/datensuppe` setzen.
  # ---------------------------------------------------------------------------
  # rclone-datensuppe:
  #   image: rclone/rclone:latest
  #   command:
  #     - mount
  #     - gdrive-faas:Fundraising/FaaS
  #     - /datensuppe
  #     - --read-only
  #     - --allow-other
  #     - --vfs-cache-mode=minimal
  #   volumes:
  #     - ./rclone.conf:/config/rclone/rclone.conf:ro
  #     - datensuppe:/datensuppe:shared
  #   cap_add:
  #     - SYS_ADMIN
  #   devices:
  #     - /dev/fuse
  #   security_opt:
  #     - apparmor:unconfined
  #   restart: unless-stopped

volumes:
  pgdata:
  # datensuppe:   # nur bei aktiviertem rclone-Mount einkommentieren
