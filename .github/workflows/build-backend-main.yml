name: Publish backend main image

# Path-filtered: only rebuilds the Directus backend image when something under
# apps/directus/** changes on main.

on:
  # Manual trigger — rebuilds faas-backend:main on demand.
  workflow_dispatch:
  # ─────────────────────────────────────────────────────────────────────────────
  # PUSH-AUSLOESER STILLGELEGT am 29.07.2026.
  #
  # Grund: GitHub weist jeden Lauf ab mit «The job was not started because
  # recent account payments have failed or your spending limit needs to be
  # increased» — das Actions-Budget der Organisation wepublish ist erschoepft.
  # Jeder Push loeste damit eine Fehlermail aus, ohne dass je ein Image
  # entstanden waere. Der letzte erfolgreiche Lauf war am 29.07. um 09:52.
  #
  # Fuer unseren Betrieb ist der Workflow NICHT kritisch: `scripts/deploy-front.sh`
  # baut das Image seit dem Vorfall vom 24.07. auf dem Mac und uebertraegt es
  # direkt auf die VPS (nie Build auf der VPS, nie ueber GHCR).
  #
  # ZURUECKNEHMEN, sobald das Budget wieder steht: die vier Zeilen unter
  # `# push:` entkommentieren. `workflow_dispatch` bleibt die ganze Zeit
  # verfuegbar, der Workflow ist also weiter von Hand ausloesbar.
  # ─────────────────────────────────────────────────────────────────────────────
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'apps/directus/**'

jobs:
  date_sha_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image_tag.outputs.tag }}
    steps:
      - id: image_tag
        run: echo "tag=$(date +%s)-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  publish_main_docker:
    needs: date_sha_tag
    uses: ./.github/workflows/publish-docker-image.yml
    with:
      context: apps/directus
      tags: |
        ghcr.io/wepublish/faas-backend:main-${{ needs.date_sha_tag.outputs.tag }}
        ghcr.io/wepublish/faas-backend:main
    secrets: inherit
